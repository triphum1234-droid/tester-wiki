                        <li><strong>ดูหลายชั้นของระบบ:</strong> ฝึกเว็บ/API และ SQL ในสภาพแวดล้อมที่ได้รับอนุญาต</li>

                </div>
                <p class="text-sm text-slate-700">อย่าพยายามทดสอบทุกค่าที่เป็นไปได้ ให้ระบุเป้าหมายและความเสี่ยงก่อน แล้วเลือกหลักฐานและวิธีทดสอบที่เหมาะสม ข้อความสีหรือรูปแบบการ์ดในเว็บใช้เพื่อช่วยอ่าน ไม่ได้หมายความว่ามีระดับมาตรฐานรับรอง</p>

            'qa_vocab': `
                <h1 class="text-slate-900 border-b-2 border-indigo-500 pb-2 inline-block">คำศัพท์และสิ่งที่ต้องรู้พื้นฐาน</h1>
                <p class="text-slate-600 mt-4 text-lg">คำศัพท์ช่วยให้ทีมสื่อสารตรงกัน แต่การใช้งานจริงและชื่อสถานะอาจแตกต่างกันตามโครงการ ควรยืนยันความหมายกับทีมเมื่อเริ่มงาน</p>

                <h3 class="text-indigo-800 mt-8 mb-4 border-b border-slate-200 pb-2"><i class="fas fa-compass mr-2" aria-hidden="true"></i> แนวคิดพื้นฐาน</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">Quality Assurance (QA) และ Testing</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">QA เน้นสร้างความเชื่อมั่นและปรับปรุงวิธีทำงานที่ช่วยให้เกิดคุณภาพ ส่วน testing เน้นประเมินผลิตภัณฑ์และให้ข้อมูลเกี่ยวกับคุณภาพ ทั้งสองเกี่ยวข้องกันและไม่ใช่ชื่อเรียกของงานเดียวกันทุกบริบท</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">Verification และ Validation</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">Verification ตรวจว่าสิ่งที่สร้างสอดคล้องกับข้อกำหนดที่ระบุหรือไม่ ส่วน validation ตรวจว่าผลิตภัณฑ์ตอบโจทย์การใช้งานและความต้องการจริงหรือไม่ วิธีตรวจอาจมีทั้งการทบทวนและการทดสอบ</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">Testing และ Debugging</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">Testing เปิดเผยข้อมูลเกี่ยวกับพฤติกรรมหรือข้อบกพร่อง ส่วน debugging คือการวิเคราะห์หาสาเหตุและแก้ไขโค้ดหรือระบบ หลังแก้แล้วควรตรวจซ้ำและพิจารณาผลกระทบที่เกี่ยวข้อง</p>
                    </div>

                        <strong class="text-slate-800 text-lg">Coverage (ความครอบคลุม)</strong>

                    </div>
                </div>

                <h3 class="text-indigo-800 mt-8 mb-4 border-b border-slate-200 pb-2"><i class="fas fa-book mr-2"></i> คำศัพท์หมวด: ประเภทของการทดสอบ (Test Types)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">UAT (User Acceptance Testing)</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">การทดสอบการยอมรับที่ผู้ใช้ ลูกค้า หรือผู้แทนธุรกิจช่วยตรวจว่าผลิตภัณฑ์ตอบโจทย์การใช้งานและเกณฑ์ที่ตกลงไว้หรือไม่ บทบาท ผู้เข้าร่วม และเวลาทำ UAT แตกต่างกันได้ และไม่ได้เป็นด่านบังคับสุดท้ายของทุกทีม</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">SIT (System Integration Testing)</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">ตรวจการทำงานร่วมกันระหว่างระบบหรือส่วนประกอบที่เชื่อมต่อกัน เช่น บริการสั่งซื้อกับบริการชำระเงิน ตรวจสัญญาข้อมูล การจัดการข้อผิดพลาด และผลของการสื่อสารระหว่างกัน รายละเอียดขอบเขตขึ้นกับสถาปัตยกรรมและทีม</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">Regression Testing</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">ทดสอบซ้ำเพื่อประเมินว่าการเปลี่ยนแปลง เช่น แก้บั๊กหรือเพิ่มฟีเจอร์ กระทบส่วนอื่นหรือไม่ เลือกขอบเขตตามความเสี่ยงและผลกระทบ การเปลี่ยนทุกครั้งไม่จำเป็นต้องรันชุดทดสอบทั้งหมด</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">Smoke Testing</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">ชุดตรวจสอบสั้นๆ ของฟังก์ชันสำคัญเพื่อดูว่าบิลด์หรือสภาพแวดล้อมพร้อมสำหรับการทดสอบต่อหรือไม่ หากไม่ผ่าน ทีมอาจหยุดและแก้ปัญหาพื้นฐานก่อน ทั้งขอบเขตและเกณฑ์ผ่านควรตกลงกัน</p>
                    </div>
                </div>

                <h3 class="text-indigo-800 mt-8 mb-4 border-b border-slate-200 pb-2"><i class="fas fa-layer-group mr-2"></i> คำศัพท์หมวด: ระดับของการทดสอบ (Testing Levels)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">Unit Testing</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">ตรวจหน่วยย่อยของซอฟต์แวร์ เช่น ฟังก์ชัน คลาส หรือโมดูล โดยมักแยกจากระบบภายนอกที่ยังไม่ใช่เป้าหมายของการทดสอบ ผู้พัฒนาและผู้เชี่ยวชาญด้านการทดสอบอาจร่วมกันออกแบบหรือดูแลการทดสอบระดับนี้</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">Integration Testing</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">ตรวจการโต้ตอบระหว่างส่วนประกอบหรือระบบ เช่น บริการกับฐานข้อมูล หรือบริการสองตัวที่เชื่อมผ่าน API ขอบเขตอาจแคบหรือกว้างตามระบบ และอาจมีการทดสอบตั้งแต่ระดับส่วนประกอบไปจนถึงระดับระบบ</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">System Testing</strong>

                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">E2E (End-to-End Testing)</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">ตรวจเส้นทางการทำงานตั้งแต่ต้นจนจบผ่านส่วนประกอบที่เกี่ยวข้อง เช่น สร้างคำสั่งซื้อและตรวจผลการชำระเงิน โดยใช้บริการจริงหรือจำลองบางส่วนได้ตามเป้าหมายและความเสี่ยง</p>
                    </div>
                </div>

                <h3 class="text-indigo-800 mt-8 mb-4 border-b border-slate-200 pb-2"><i class="fas fa-balance-scale mr-2"></i> Functional VS Non-Functional</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-blue-50 p-4 rounded-lg border border-blue-200 shadow-sm">
                        <strong class="text-blue-800 text-lg">Functional Testing</strong>
                        <p class="text-sm text-blue-900 mt-1 mb-0">ตรวจว่าระบบทำงานและให้ผลตามข้อกำหนดหรือไม่ เช่น เข้าสู่ระบบได้ตามกติกาและคำนวณยอดตะกร้าถูกต้อง</p>
                    </div>
                    <div class="bg-amber-50 p-4 rounded-lg border border-amber-200 shadow-sm">
                        <strong class="text-amber-800 text-lg">Non-Functional Testing</strong>

                    </div>
                </div>

                <h3 class="text-indigo-800 mt-8 mb-4 border-b border-slate-200 pb-2"><i class="fas fa-file-alt mr-2"></i> คำศัพท์หมวด: เอกสารและการจัดการ</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">Test Scenario (ภาพกว้าง)</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">สถานการณ์หรือหัวข้อที่เราจะเทส เช่น "ทดสอบการล็อคอินด้วยรหัสผ่านผิด" (มักเขียนเป็นบรรทัดเดียวสั้นๆ)</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">Test Case (รายละเอียดลึก)</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">ชุดเงื่อนไข ข้อมูล ขั้นตอน และผลที่คาดหวังซึ่งใช้ตรวจสอบเป้าหมายหนึ่งๆ ระดับรายละเอียดขึ้นกับผู้ใช้ชุดทดสอบ ความเสี่ยง และวิธีทำงานของทีม ไม่จำเป็นต้องเขียนทุกกรณีเป็นขั้นตอนตายตัว</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">

                    </div>
                </div>

                <h3 class="text-indigo-800 mt-8 mb-4 border-b border-slate-200 pb-2"><i class="fas fa-laptop-code mr-2"></i> คำศัพท์หมวด: เทคนิคการทำงาน</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-green-600 text-lg"><i class="fas fa-plus-circle mr-1"></i> Positive Testing</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">ทดสอบด้วยข้อมูลและลำดับที่ถูกต้องตามข้อกำหนด เช่น ผู้ใช้เข้าสู่ระบบและทำงานหลักได้สำเร็จ</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-red-600 text-lg"><i class="fas fa-minus-circle mr-1"></i> Negative Testing</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">ทดสอบข้อมูลหรือเหตุการณ์ที่ไม่ถูกต้องตามข้อกำหนด เพื่อดูว่าระบบปฏิเสธหรือจัดการข้อผิดพลาดได้อย่างปลอดภัย โดยยึดขอบเขตและกติกาของระบบ</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">Black-Box Testing</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">ออกแบบการทดสอบจากพฤติกรรมและข้อกำหนดที่สังเกตได้ โดยไม่จำเป็นต้องตรวจโครงสร้างภายใน ผู้ทดสอบ นักพัฒนา และทีมอื่นใช้วิธีนี้ได้</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">Edge Case</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">เงื่อนไขหรือชุดเหตุการณ์ที่มักไม่อยู่ในเส้นทางหลัก เช่น ข้อมูลยาวเกินข้อกำหนดหรือการเชื่อมต่อขาดกลางทาง คำว่า edge case ไม่ได้แปลว่าความเสี่ยงต่ำเสมอ ให้พิจารณาผลกระทบและกติกาจริง</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">White-Box Testing</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">ออกแบบการทดสอบโดยอาศัยโครงสร้างภายใน เช่น การไล่เส้นทางหรือเงื่อนไขในโค้ด ไม่ได้หมายถึงตรวจทุกบรรทัดเสมอ และนำไปใช้ได้หลายระดับ ไม่จำกัดเฉพาะ unit tests</p>
                    </div>
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-lg">Exploratory Testing</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">การเรียนรู้ ออกแบบ และรันทดสอบไปพร้อมกันภายในช่วงเวลาที่กำหนด อาจใช้ charter หรือคำถามนำ แล้วบันทึกสิ่งที่ตรวจ หลักฐาน และข้อค้นพบ ไม่ใช่การสุ่มคลิกโดยไม่มีเป้าหมาย</p>
                    </div>
                </div>

                <h3 class="text-indigo-800 mt-8 mb-4 border-b border-slate-200 pb-2"><i class="fas fa-server mr-2"></i> คำศัพท์หมวด: Environment (สภาพแวดล้อม)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-slate-100 p-4 rounded-lg border border-slate-300 shadow-sm">
                        <strong class="text-slate-800 text-lg font-mono">DEV (Development)</strong>
                        <p class="text-sm text-slate-600 mt-1 mb-0">สภาพแวดล้อมสำหรับพัฒนาและตรวจงานระหว่างสร้างระบบ ทีมอาจเริ่มทดสอบใน DEV ได้ตามการเข้าถึงและความเสถียรของระบบ</p>
                    </div>
                    <div class="bg-blue-50 p-4 rounded-lg border border-blue-200 shadow-sm">
                        <strong class="text-blue-800 text-lg font-mono">SIT / QA (Testing)</strong>

            'stlc': `
                <h1 class="text-slate-900 border-b-2 border-blue-500 pb-2 inline-block">STLC (Software Testing Life Cycle) แบบเจาะลึก</h1>
                <p class="text-slate-600 mt-4 text-lg">STLC เป็นแบบจำลองกิจกรรมที่ช่วยวางแผนและติดตามงานทดสอบ ลำดับและเอกสารจริงแตกต่างกันตามทีม วิธีพัฒนา ข้อบังคับ และความเสี่ยง กิจกรรมหลายอย่างเกิดซ้ำหรือทำควบคู่กันได้</p>
                
                <div class="space-y-6 mt-6">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <h3 class="text-blue-800 mt-0 font-bold border-b border-blue-100 pb-2"><i class="fas fa-search mr-2"></i> Phase 1: Requirement Analysis (วิเคราะห์ความต้องการ)</h3>
                        <p class="text-sm text-slate-700"><strong>เป้าหมาย:</strong> ตรวจสอบว่า Requirement ที่ SA หรือ PO เขียนมานั้น "สามารถนำมาทดสอบได้จริงหรือไม่ (Testability)" และครอบคลุมเงื่อนไขครบถ้วนไหม</p>
                        <p class="text-sm text-slate-700"><strong>สิ่งที่ QA ช่วยได้:</strong> ร่วมทบทวน requirement, ตั้งคำถามถึงกรณีที่ยังไม่ชัด (เช่น ถ้าระบบขัดข้องตอนจ่ายเงินจะเกิดอะไรขึ้น?) และช่วยทีมระบุความเสี่ยง</p>
                        <div class="bg-blue-50 text-blue-900 p-2 rounded mt-2 text-sm border border-blue-200"><strong>ผลที่อาจได้:</strong> ข้อกำหนดที่ชัดขึ้น รายการคำถาม และการเชื่อมโยงความต้องการกับการทดสอบ (เช่น RTM เมื่อทีมเห็นว่าจำเป็น)</div>

                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <h3 class="text-blue-800 mt-0 font-bold border-b border-blue-100 pb-2"><i class="fas fa-chess-knight mr-2"></i> Phase 2: Test Planning (วางแผนการทดสอบ)</h3>
                        <p class="text-sm text-slate-700"><strong>เป้าหมาย:</strong> กำหนดแนวทาง ขอบเขต ระยะเวลา และทรัพยากร โดยผู้รับผิดชอบการทดสอบร่วมกับทีม</p>

                            <li><strong>Approach:</strong> ระบุระดับ ประเภท และวิธีทดสอบที่เหมาะกับความเสี่ยง ไม่จำเป็นต้องตั้งสัดส่วน Manual/Automation ล่วงหน้า</li>
                            <li><strong>Environment:</strong> ระบุระบบและข้อมูลที่ต้องใช้ ผู้รับผิดชอบ ข้อจำกัด และวิธีจัดการข้อมูลอย่างปลอดภัย</li>

                    </div>

                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <h3 class="text-red-800 mt-0 font-bold border-b border-red-100 pb-2"><i class="fas fa-bug mr-2"></i> Phase 5: Test Execution (ลงมือทดสอบ)</h3>
                        <p class="text-sm text-slate-700"><strong>เป้าหมาย:</strong> ดำเนินการตรวจตามแนวทางที่เลือก บันทึกผลและหลักฐาน แล้วรายงานข้อบกพร่องที่พบ</p>

                            <li><strong>Log Defect:</strong> บันทึกข้อบกพร่องใน Issue tracker หรือช่องทางที่ทีมใช้ พร้อมขั้นตอนทำซ้ำ ผลที่คาด ผลจริง และสภาพแวดล้อมที่เกี่ยวข้อง</li>
                            <li><strong>Retesting:</strong> เมื่อมี build ที่รวมการแก้ไขแล้ว ให้ตรวจจุดที่พบปัญหาอีกครั้งตามเกณฑ์ที่ตกลงกัน</li>

                        <h3 class="text-green-800 mt-0 font-bold border-b border-green-100 pb-2"><i class="fas fa-flag-checkered mr-2"></i> Phase 6: Test Cycle Closure (สรุปผล)</h3>
                        <p class="text-sm text-slate-700"><strong>เป้าหมาย:</strong> สรุปขอบเขตที่ทดสอบ ผลที่พบ ความเสี่ยงที่ยังเหลือ และข้อจำกัด เพื่อให้ผู้มีอำนาจตัดสินใจใช้ข้อมูลประกอบการปล่อยซอฟต์แวร์ การทดสอบไม่สามารถรับประกันว่าไม่มีบั๊ก</p>

                <h1 class="text-slate-900 border-b-2 border-teal-500 pb-2 inline-block">เทคนิคออกแบบการทดสอบ</h1>

                <h3 class="text-teal-800 mt-8 mb-4 border-b border-slate-200 pb-2"><i class="fas fa-th-large mr-2"></i> 1. Equivalence Partitioning (EP) - การแบ่งกลุ่มข้อมูล</h3>

            'automation_strategy': `

                            <li><strong>งานตรวจซ้ำในระดับเหมาะสม:</strong> เลือกระดับที่ให้ผลคุ้มค่า เช่น unit, API หรือ UI ตามจุดเสี่ยง</li>

                    <div class="flex-1 bg-red-50 border-t-4 border-red-500 p-6 rounded-b-xl shadow-sm">

                    <div class="relative z-10">
                        <h2 class="text-indigo-400 mt-0 font-heading text-2xl border-b border-slate-700 pb-2">The Test Automation Pyramid</h2>
                        <p class="text-sm text-slate-300 mt-4 mb-6">Test Automation Pyramid เป็นแบบจำลองช่วยคุยเรื่องระดับการทดสอบ ไม่ใช่สัดส่วนบังคับหรือสูตรที่ใช้ได้กับทุกสถาปัตยกรรม</p>
                        
                        <div class="flex flex-col items-center space-y-2">

                            <div class="w-1/3 bg-red-500 text-center py-3 rounded-t-lg font-bold text-white shadow">UI / E2E</div>

                            <div class="w-2/3 bg-yellow-500 text-center py-3 font-bold text-slate-900 shadow">API / Integration</div>
                            <!-- Bottom -->
                            <div class="w-full bg-green-500 text-center py-3 rounded-b-lg font-bold text-slate-900 shadow">Unit / Component</div>

                        <ul class="text-sm text-slate-300 space-y-2 mt-6">
                            <li><strong class="text-green-400">Unit / Component:</strong> มักให้ feedback เร็วและแยกหาสาเหตุได้ง่าย เหมาะกับการตรวจตรรกะในขอบเขตแคบ</li>
                            <li><strong class="text-yellow-400">API / Integration:</strong> ตรวจสัญญาและการทำงานร่วมกันโดยไม่ต้องขับผ่าน UI ทุกครั้ง</li>
                            <li><strong class="text-red-400">UI / E2E:</strong> ตรวจเส้นทางสำคัญใกล้เคียงการใช้งานจริง แต่ต้องเตรียมข้อมูลและดูแลสภาพแวดล้อม</li>
                            <li>เลือกระดับตามสถาปัตยกรรม ความเสี่ยง และจุดที่ให้ feedback ได้เร็ว ไม่ต้องทำสัดส่วนตามรูปนี้</li>
                        </ul>
                    </div>
                </div>
            `,
            'playwright': `
                <h1 class="text-slate-900 border-b-2 border-blue-500 pb-2 inline-block">Playwright สำหรับ UI/E2E Testing</h1>
                <p class="text-slate-600 mt-4 text-lg">Playwright เป็น framework สำหรับทดสอบเว็บที่มี API ใน JavaScript/TypeScript, Python, Java และ .NET ใช้ทดสอบ Chromium, Firefox และ WebKit เลือกเครื่องมือโดยดูภาษา ความถนัดของทีม เบราว์เซอร์เป้าหมาย และสภาพแวดล้อมของโครงการ</p>

                <h2 class="text-blue-800 mt-8 mb-4 border-b border-slate-200 pb-2"><i class="fas fa-compass mr-2" aria-hidden="true"></i> จุดเด่นและขอบเขตการใช้งาน</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 block mb-2 text-lg"><i class="fas fa-window-maximize text-yellow-500 mr-2" aria-hidden="true"></i> 1. ทดสอบหลาย browser engine</strong>
                        <p class="text-sm text-slate-600">ทดสอบด้วย Chromium, Firefox และ WebKit เพื่อค้นหาความต่างระหว่าง engine ได้ การรองรับเบราว์เซอร์และระบบปฏิบัติการจริงยังขึ้นกับการตั้งค่าและสภาพแวดล้อมที่เลือก</p>
                    </div>
                    
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 block mb-2 text-lg"><i class="fas fa-stopwatch text-green-500 mr-2"></i> 2. Auto-Waiting (รออัตโนมัติ)</strong>
                        <p class="text-sm text-slate-600">ก่อนทำ action เช่น click จะตรวจเงื่อนไขที่เกี่ยวข้องกับการกระทำนั้น และ assertion แบบ web-first จะลองตรวจซ้ำตามเวลาที่กำหนด ช่วยลดการใช้เวลารอแบบตายตัว แต่ไม่ได้แก้ปัญหาการรอทุกชนิดหรือการออกแบบเทสที่ไม่แน่นอน</p>
                    </div>

                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 block mb-2 text-lg"><i class="fas fa-network-wired text-purple-500 mr-2"></i> 3. Network Interception</strong>
                        <p class="text-sm text-slate-600">Playwright สามารถดักจับ API ที่หน้าเว็บคุยกับหลังบ้านได้ เราสามารถสั่งให้มันจำลอง (Mock) ข้อมูลจากหลังบ้านได้เลยโดยไม่ต้องไปตั้งค่า Database จริง</p>

                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 block mb-2 text-lg"><i class="fas fa-clone text-pink-500 mr-2"></i> 4. Browser Contexts</strong>
                        <p class="text-sm text-slate-600">Browser contexts แยกคุกกี้และสถานะ session เพื่อจำลองผู้ใช้หลายคนได้ ส่วนการเปิดหลายแท็บใน context เดียวกันอาจใช้สถานะร่วมกัน จึงควรเลือก context ให้ตรงกับสถานการณ์ที่ต้องการทดสอบ</p>
                    </div>
                </div>

                <h3 class="text-blue-800 mt-10 mb-4 border-b border-slate-200 pb-2"><i class="fas fa-code mr-2"></i> ตัวอย่างโค้ด Playwright (TypeScript)</h3>
                <p class="text-sm text-slate-600 mb-2">ตัวอย่างนี้สมมติว่าแอปมีฟอร์มที่ติดป้ายกำกับว่า “อีเมล” และ “รหัสผ่าน” กับหัวข้อหลังเข้าสู่ระบบชื่อ “บัญชีของฉัน” ตั้งค่า <code>baseURL</code> ให้ชี้ไปยังแอปทดสอบของทีมก่อนรัน</p>
                <div class="bg-slate-900 p-6 rounded-xl shadow-xl overflow-x-auto relative group">
                    <div class="absolute top-0 right-0 bg-slate-700 text-xs px-3 py-1 rounded-bl-lg rounded-tr-xl text-slate-200 font-sans opacity-70 group-hover:opacity-100 transition">login.spec.ts</div>
<pre class="font-mono text-sm leading-relaxed m-0"><code><span class="text-pink-400">import</span> { test, expect } <span class="text-pink-400">from</span> <span class="text-green-300">'@playwright/test'</span>;

test(<span class="text-green-300">'ทดสอบระบบ Login ด้วยข้อมูลที่ถูกต้อง'</span>, <span class="text-blue-400">async</span> ({ page }) => {
  <span class="text-slate-500">// 1. Navigate (มันจะรอให้หน้าเว็บโหลดเสร็จเอง)</span>
  <span class="text-blue-400">await</span> page.<span class="text-yellow-200">goto</span>(<span class="text-green-300">'/login'</span>);

  <span class="text-slate-500">// 2. Interact (ไม่ต้องสั่ง wait, มันจัดการให้)</span>
  <span class="text-blue-400">await</span> page.<span class="text-yellow-200">getByLabel</span>(<span class="text-green-300">'อีเมล'</span>).<span class="text-yellow-200">fill</span>(process.env.E2E_USER ?? <span class="text-green-300">'tester@example.test'</span>);
  <span class="text-blue-400">await</span> page.<span class="text-yellow-200">getByLabel</span>(<span class="text-green-300">'รหัสผ่าน'</span>).<span class="text-yellow-200">fill</span>(process.env.E2E_PASSWORD ?? <span class="text-green-300">'test-only-password'</span>);
  <span class="text-blue-400">await</span> page.<span class="text-yellow-200">getByRole</span>(<span class="text-green-300">'button'</span>, { name: <span class="text-green-300">'เข้าสู่ระบบ'</span> }).<span class="text-yellow-200">click</span>();

  <span class="text-slate-500">// 3. Assert (เช็คว่ามีกล่องข้อความ Welcome โผล่มา)</span>
  <span class="text-blue-400">await</span> <span class="text-yellow-200">expect</span>(page.<span class="text-yellow-200">getByRole</span>(<span class="text-green-300">'heading'</span>, { name: <span class="text-green-300">'บัญชีของฉัน'</span> })).<span class="text-yellow-200">toBeVisible</span>();
});</code></pre>
                </div>
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-200 mt-4">
                    <strong class="text-blue-800"><i class="fas fa-magic mr-2 text-blue-600" aria-hidden="true"></i> ข้อควรจำสำหรับมือใหม่:</strong>
                    <p class="text-sm text-blue-900 mt-1 mb-0">ฟีเจอร์ <strong>Codegen</strong> ช่วยบันทึกการโต้ตอบและเสนอ locator/โค้ดตัวอย่างได้ ใช้เป็นร่างเริ่มต้นแล้วตรวจ locator, assertion, ข้อมูลลับ และความทนทานของเทสก่อนนำไปใช้จริง</p>
                </div>
            `,
            'cypress': `
                <h1 class="text-slate-900 border-b-2 border-emerald-500 pb-2 inline-block">Cypress (สำหรับงาน Frontend)</h1>
                <p class="text-slate-600 mt-4 text-lg">Cypress เป็นชุดเครื่องมือทดสอบเว็บที่มี runner และเครื่องมือดูการทำงานระหว่างทดสอบ เหมาะกับทีมที่ต้องการ workflow ใน JavaScript/TypeScript และตรวจพฤติกรรมของแอปในเบราว์เซอร์ ควรเปรียบเทียบกับเครื่องมืออื่นตาม browser, ภาษา, สถาปัตยกรรม และข้อกำหนดของโครงการ</p>

                <div class="bg-emerald-50 p-6 rounded-xl border border-emerald-200 my-8 shadow-sm">
                    <h3 class="text-emerald-800 mt-0 font-bold text-xl"><i class="fas fa-heart text-red-400 mr-2"></i> จุดเด่นที่ทำให้ Cypress ครองใจผู้ใช้</h3>
                    <ul class="text-sm text-emerald-900 space-y-3 pl-5 list-disc mt-4">
                        <li><strong>Runner และการดีบัก:</strong> Test Runner แสดงคำสั่งและ snapshots ตามการตั้งค่า ช่วยตรวจย้อนกลับว่าหน้าเว็บอยู่ในสถานะใดระหว่างทดสอบ</li>
                        <li><strong>Retry-ability:</strong> queries และ assertions บางชนิดลองซ้ำจนผ่านหรือหมดเวลา ช่วยลดการรอแบบตายตัว แต่ต้องเขียนเงื่อนไขและข้อมูลให้แน่นอน</li>
                        <li><strong>Network:</strong> <code>cy.intercept()</code> ใช้สังเกตคำขอของแอป รอ ตรวจ หรือ stub คำตอบได้ การ stub เหมาะกับกรณีควบคุมสถานการณ์ แต่ไม่ยืนยันว่าบริการจริงทำงานถูกต้อง</li>
                    </ul>
                </div>

                <div class="bg-red-50 p-6 rounded-xl border border-red-200 my-8 shadow-sm">
                    <h3 class="text-red-800 mt-0 font-bold text-xl"><i class="fas fa-exclamation-triangle mr-2"></i> ข้อจำกัด (Trade-offs) ที่ต้องรู้</h3>
                    <p class="text-sm text-red-900 mb-4">ไม่มีทูลไหนสมบูรณ์แบบ Cypress มีสถาปัตยกรรมที่ทำงาน "ภายในบราวเซอร์เดียวกัน" ทำให้เกิดข้อจำกัดทางเทคนิคบางอย่าง:</p>
                    <ul class="text-sm text-red-900 space-y-3 pl-5 list-disc">
                        <li><strong>ภาษา:</strong> Cypress ใช้ JavaScript/TypeScript เป็นหลัก หากทีมต้องการภาษาอื่น เครื่องมืออื่นอาจเหมาะกว่า</li>
                        <li><strong>หลาย origin:</strong> การทดสอบข้าม origin ใน test เดียวต้องใช้ <code>cy.origin()</code> และทำตามข้อจำกัดของเบราว์เซอร์และ Cypress ส่วน cross-origin iframe ยังมีข้อจำกัดที่ควรตรวจในเอกสารรุ่นที่ใช้อยู่</li>
                        <li><strong>หลายแท็บ:</strong> Cypress ไม่ได้มี workflow ทั่วไปสำหรับควบคุมหลายแท็บแบบเดียวกับเบราว์เซอร์อัตโนมัติบางตัว ควรออกแบบการตรวจตามสิ่งที่ต้องการยืนยัน และตรวจข้อจำกัดรุ่นปัจจุบัน</li>
                    </ul>
                </div>
            `,
            'pom': `
                <h1 class="text-slate-900 border-b-2 border-indigo-500 pb-2 inline-block">Design Pattern: Page Object Model (POM)</h1>
                <p class="text-slate-600 mt-4 text-lg">Page Object Model (POM) เป็นรูปแบบหนึ่งในการรวมการโต้ตอบกับหน้าไว้ในโมดูลที่ใช้ซ้ำได้ วิธีนี้ช่วยลดการซ้ำของ locator และขั้นตอน แต่ไม่ใช่ข้อบังคับ บางชุดทดสอบอาจอ่านง่ายกว่าเมื่อใช้ helper แบบเล็กแทน class ขนาดใหญ่</p>

                <div class="bg-amber-50 p-5 rounded-xl border border-amber-200 my-6 shadow-sm">

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                        <div class="p-4 bg-slate-50 h-full">

<pre class="text-[11px] font-mono bg-white p-3 rounded border border-slate-200 text-slate-800"><code>import { type Locator, type Page } from '@playwright/test';

export class LoginPage {

<pre class="text-[11px] font-mono bg-white p-3 rounded border border-slate-200 text-slate-800"><code>import { test, expect } from '@playwright/test';
import { LoginPage } from './LoginPage';

test('ทดสอบ Login', async ({ page }) => {

                        </div>

                <div class="bg-green-50 p-4 rounded-lg border border-green-200 mt-6">

                    <p class="text-sm text-green-900 mt-1 mb-0">หาก label หรือ flow เปลี่ยน อาจแก้ locator หรือการกระทำที่ใช้ร่วมกันในจุดเดียวได้ แล้วรันทดสอบเพื่อยืนยันว่าพฤติกรรมและความหมายของเทสยังถูกต้อง</p>

            'api_deepdive': `
                <h1 class="text-slate-900 border-b-2 border-orange-500 pb-2 inline-block">โครงสร้าง API และ HTTP แบบเจาะลึก</h1>
                <p class="text-slate-600 mt-4 text-lg">API เป็นหนึ่งในจุดเชื่อมต่อที่ผู้ทดสอบใช้ตรวจข้อมูลและพฤติกรรมระหว่างส่วนประกอบของระบบ การเข้าใจ HTTP ช่วยให้ตรวจคำขอ คำตอบ และสัญญาของบริการได้เป็นระบบ API มีหลายรูปแบบ และไม่ได้หมายถึง REST อย่างเดียว</p>

                <h2 class="text-slate-800 mt-8 mb-4">API และ HTTP ทำงานร่วมกันอย่างไร?</h2>
                <p class="text-sm text-slate-700">ไคลเอนต์ส่ง HTTP request ไปยัง resource หรือ endpoint แล้วรับ response กลับมา คำขอมักประกอบด้วย method, URL, headers และอาจมี query parameters หรือ body ตามสัญญาของ API ไม่จำเป็นต้องมีทุกส่วนในทุกคำขอ</p>

                <h3 class="text-orange-800 mt-8 mb-4 border-b border-slate-200 pb-2"><i class="fas fa-paper-plane mr-2"></i> โครงสร้างฝั่ง Request (เราเป็นคนส่ง)</h3>
                <p class="text-sm text-slate-700 mb-4">ส่วนที่พบบ่อยใน request มีดังนี้ ให้ยึด API contract ว่าส่วนใดจำเป็น:</p>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 block text-md"><span class="bg-slate-200 px-2 py-0.5 rounded text-xs mr-2">1</span> URL / Endpoint</strong>
                        <p class="text-sm text-slate-600 mt-2">ที่อยู่เป้าหมาย เช่น <code>https://api.example.test/v1/users/123</code> ซึ่งเป็นโดเมนตัวอย่าง ไม่ใช่บริการสำหรับทดสอบจริง</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 block text-md"><span class="bg-slate-200 px-2 py-0.5 rounded text-xs mr-2">2</span> Headers</strong>
                        <p class="text-sm text-slate-600 mt-2">ข้อมูลกำกับ เช่น <code>Content-Type</code>, <code>Accept</code> หรือข้อมูลยืนยันตัวตน เก็บ token เป็นความลับและอย่าใส่ในภาพหรือ log ที่แชร์ต่อ</p>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm sm:col-span-2">
                        <strong class="text-slate-800 block text-md"><span class="bg-slate-200 px-2 py-0.5 rounded text-xs mr-2">3</span> HTTP Methods (กริยา)</strong>
                        <div class="grid grid-cols-2 gap-2 mt-2">
                            <div class="text-sm"><span class="font-bold text-blue-600">GET:</span> ขอ representation ของ resource โดยทั่วไปใช้เพื่ออ่านข้อมูล</div>
                            <div class="text-sm"><span class="font-bold text-green-600">POST:</span> ส่งข้อมูลเพื่อให้ resource ประมวลผล เช่น สร้างรายการใหม่ ขึ้นกับสัญญา API</div>
                            <div class="text-sm"><span class="font-bold text-amber-600">PUT:</span> แทนที่สถานะของ resource ตาม representation ที่ส่ง</div>
                            <div class="text-sm"><span class="font-bold text-amber-600">PATCH:</span> ขอปรับบางส่วนตามรูปแบบ patch ที่ API รองรับ</div>
                            <div class="text-sm"><span class="font-bold text-red-600">DELETE:</span> ขอเอา resource ออกจากสถานะที่เข้าถึงได้ ไม่ได้แปลว่าฐานข้อมูลต้องลบแถวทันที</div>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm sm:col-span-2">
                        <strong class="text-slate-800 block text-md"><span class="bg-slate-200 px-2 py-0.5 rounded text-xs mr-2">4</span> Body (Payload)</strong>
                        <p class="text-sm text-slate-600 mt-2">ข้อมูลที่ส่งมากับบาง request เช่น JSON สำหรับ POST, PUT หรือ PATCH รูปแบบและความจำเป็นขึ้นกับ API</p>
                    </div>
                </div>

                <h3 class="text-orange-800 mt-8 mb-4 border-b border-slate-200 pb-2"><i class="fas fa-reply mr-2"></i> โครงสร้างฝั่ง Response (Server ตอบกลับมา)</h3>
                <p class="text-sm text-slate-700 mb-4">ตรวจ response ให้ตรงกับ API contract ทั้ง status, headers, body, schema, ผลข้างเคียง และกติกาธุรกิจ รหัสเดียวกันไม่ได้ยืนยันว่าข้อมูลถูกต้องครบถ้วน</p>
                
                <div class="space-y-4">
                    <!-- 2xx -->
                    <div class="bg-green-50 p-4 rounded-lg border border-green-200 flex flex-col md:flex-row gap-4 items-start md:items-center">
                        <div class="bg-green-600 text-white font-mono font-bold text-2xl px-4 py-2 rounded-lg text-center min-w-[80px]">2xx</div>
                        <div>
                            <strong class="text-green-800 text-lg">Success (สำเร็จ)</strong>
                            <p class="text-sm text-green-900 mt-1 mb-0"><strong>200 OK:</strong> คำขอสำเร็จพร้อมผลลัพธ์ตาม method, <strong>201 Created:</strong> สร้าง resource แล้ว, <strong>202 Accepted:</strong> รับคำขอไปประมวลผล, <strong>204 No Content:</strong> สำเร็จโดยไม่มี response body ตามปกติ</p>
                        </div>
                    </div>
                    
                    <!-- 4xx -->
                    <div class="bg-yellow-50 p-4 rounded-lg border border-yellow-200 flex flex-col md:flex-row gap-4 items-start md:items-center">
                        <div class="bg-yellow-500 text-white font-mono font-bold text-2xl px-4 py-2 rounded-lg text-center min-w-[80px]">4xx</div>
                        <div>
                            <strong class="text-yellow-800 text-lg">4xx (คำขอหรือสิทธิ์มีปัญหา)</strong>
                            <p class="text-sm text-yellow-900 mt-1 mb-0">
                                <strong>400 Bad Request:</strong> server ปฏิเสธคำขอเพราะรูปแบบหรือข้อมูลไม่ถูกต้องตามเงื่อนไข<br>
                                <strong>401 Unauthorized:</strong> ไม่มีข้อมูลยืนยันตัวตนที่ใช้ได้ตามข้อกำหนด<br>
                                <strong>403 Forbidden:</strong> server เข้าใจคำขอแต่ไม่อนุญาตให้ทำรายการนั้น<br>
                                <strong>404 Not Found:</strong> ไม่พบ resource หรือเส้นทางตามสัญญาของบริการ<br>
                                รหัสที่คาดหวังสำหรับกรณีผิดพลาดต้องอ้างอิง API contract
                            </p>
                        </div>
                    </div>
                    
                    <!-- 5xx -->
                    <div class="bg-red-50 p-4 rounded-lg border border-red-200 flex flex-col md:flex-row gap-4 items-start md:items-center">
                        <div class="bg-red-600 text-white font-mono font-bold text-2xl px-4 py-2 rounded-lg text-center min-w-[80px]">5xx</div>
                        <div>
                            <strong class="text-red-800 text-lg">5xx (server หรือ gateway จัดการคำขอไม่สำเร็จ)</strong>
                            <p class="text-sm text-red-900 mt-1 mb-0"><strong>500 Internal Server Error:</strong> server พบสภาวะผิดพลาดที่ไม่คาดไว้, <strong>502 Bad Gateway:</strong> gateway ได้คำตอบที่ไม่ถูกต้องจาก upstream, <strong>503 Service Unavailable:</strong> ยังให้บริการไม่ได้ชั่วคราว, <strong>504 Gateway Timeout:</strong> gateway ไม่ได้รับคำตอบทันเวลา ไม่ได้แปลว่าระบบหรือเครื่อง server ล่มทุกกรณี</p>
                        </div>
                    </div>
                </div>
            `,
            'postman_advanced': `
                <h1 class="text-slate-900 border-b-2 border-orange-500 pb-2 inline-block">ทดสอบ API ด้วย Postman และ Newman</h1>
                <p class="text-slate-600 mt-4 text-lg">Postman ใช้ส่งคำขอ ตรวจ response และจัดกลุ่มคำขอเป็น Collection เพื่อทดสอบซ้ำได้ ความสามารถและตำแหน่งเมนูอาจต่างกันตามเวอร์ชัน โดยสคริปต์ตรวจ response ปัจจุบันอยู่ที่ <strong>Scripts &gt; Post-response</strong></p>

                <h2 class="text-slate-800 mt-8 mb-4">เริ่มจากเกณฑ์ใน API contract</h2>
                <p class="text-sm text-slate-700">กำหนดผลที่คาดหวังจากสัญญาของ API ก่อน เช่น status, รูปแบบข้อมูล, กฎธุรกิจ และผลข้างเคียง อย่าตั้งว่าทุกคำขอต้องได้ 200 เพราะบางกรณีอาจคาดหวัง 201, 204 หรือรหัสผิดพลาดที่ระบุไว้</p>
                <div class="bg-slate-900 text-slate-300 p-4 rounded-xl font-mono text-sm overflow-x-auto shadow-md my-4">
<pre class="m-0"><code><span class="text-slate-500">// ตัวอย่างนี้สมมติว่า contract ระบุ 200 และ JSON ที่มี id</span>
pm.test(<span class="text-green-300">"status ตรงตาม contract"</span>, () =&gt; {
    pm.response.to.have.<span class="text-yellow-200">status</span>(<span class="text-orange-400">200</span>);
});

pm.test(<span class="text-green-300">"response มี id"</span>, () =&gt; {
    <span class="text-blue-400">const</span> body = pm.response.<span class="text-yellow-200">json</span>();
    pm.<span class="text-yellow-200">expect</span>(body.id).to.exist;
});</code></pre>
                </div>
                <p class="text-sm text-slate-700">เพิ่มการตรวจ content type, ฟิลด์และชนิดข้อมูล, กฎธุรกิจ, สิทธิ์ของบทบาทต่างๆ, ข้อมูลขอบเขต และการจัดการข้อผิดพลาดตามความเสี่ยงของ API โค้ดตัวอย่างสมมติว่า response เป็น JSON และมีฟิลด์ <code>id</code> ให้ปรับให้ตรงกับระบบจริง</p>

                <h2 class="text-slate-800 mt-8 mb-4">ส่งค่าที่ตอบกลับไปใช้ในคำขอถัดไป</h2>
                <p class="text-sm text-slate-700">Collection ช่วยจัดลำดับคำขอใน workflow ได้ เช่น สร้างข้อมูลทดสอบ แล้วนำรหัสที่ได้ไปอ่านหรือแก้ข้อมูลนั้น เก็บเฉพาะค่าทดสอบที่จำเป็น และล้างข้อมูลเมื่อจบหากระบบกำหนด</p>
                <div class="bg-slate-900 text-slate-300 p-4 rounded-xl font-mono text-sm overflow-x-auto shadow-md my-4">
<pre class="m-0"><code><span class="text-slate-500">// ใน Post-response ของคำขอสร้างข้อมูล ใช้ id ที่ response ส่งกลับ</span>
<span class="text-blue-400">const</span> body = pm.response.<span class="text-yellow-200">json</span>();
pm.collectionVariables.<span class="text-yellow-200">set</span>(<span class="text-green-300">"created_record_id"</span>, body.id);</code></pre>
                </div>
                <p class="text-sm text-slate-700">คำขอถัดไปอ้างค่าด้วย <code>{{created_record_id}}</code> ตรวจชื่อและล้าง collection variable เมื่อไม่ต้องใช้แล้ว สำหรับ token หรือ secret ให้ใช้ Postman Vault หรือวิธีจัดการความลับที่องค์กรอนุมัติ อย่าฝังค่าไว้ใน collection, ไฟล์ environment ที่แชร์ หรือ source control</p>

                <div class="bg-blue-50 p-5 rounded-xl border border-blue-200 mt-6">
                    <h2 class="text-blue-800 mt-0 font-bold">รันทดสอบซ้ำใน CI</h2>
                    <p class="text-sm text-blue-900">ใช้ Collection Runner สำหรับการรันใน Postman หรือใช้ Newman เพื่อรัน collection ผ่าน command line และต่อกับ CI ตามความเหมาะสม ตัวอย่างคำสั่ง:</p>
                    <pre class="bg-white text-slate-800 p-3 rounded border border-blue-100 overflow-x-auto"><code>newman run collection.json -e test-environment.json</code></pre>
                    <p class="text-sm text-blue-900 mb-0">ใช้ระบบทดสอบที่ได้รับอนุญาตและข้อมูลที่สร้างซ้ำได้ จัดเก็บ credential ด้วย secret store ของ CI ห้าม commit ค่า secret ใน environment file และกำหนดการทำความสะอาดข้อมูลที่สร้างไว้</p>
                </div>
            `,
            'database_testing': `
                <h1 class="text-slate-900 border-b-2 border-cyan-500 pb-2 inline-block">SQL และการทดสอบข้อมูลสำหรับ QA</h1>
                <p class="text-slate-600 mt-4 text-lg">SQL ช่วยตรวจข้อมูลที่เก็บในฐานข้อมูลและหาความต่างระหว่างผลที่คาดกับผลจริง ใช้สิทธิ์และสภาพแวดล้อมตามที่ทีมอนุมัติ และอย่าคิดว่าการเห็นข้อมูลในฐานข้อมูลเพียงอย่างเดียวพิสูจน์พฤติกรรมทั้งหมดของผู้ใช้ได้</p>

                <div class="bg-cyan-50 p-5 rounded-xl border border-cyan-200 my-6">
                    <h2 class="text-cyan-800 mt-0 font-bold">เริ่มจากคำสั่งอ่านข้อมูล</h2>
                    <ul class="list-disc pl-5 space-y-2 text-sm text-cyan-900 mb-0">
                        <li><code>SELECT</code> เลือกคอลัมน์และข้อมูลที่ต้องการดู</li>
                        <li><code>WHERE</code> กรองแถว เช่น <code>status = 'paid'</code></li>
                        <li><code>ORDER BY</code> เรียงผลเพื่ออ่านหรือเปรียบเทียบ</li>
                        <li><code>JOIN</code> เชื่อมข้อมูลที่สัมพันธ์กัน</li>
                        <li><code>COUNT</code>, <code>SUM</code>, <code>GROUP BY</code> สรุปจำนวนหรือยอดตามกลุ่ม</li>
                        <li><code>IS NULL</code> และ <code>IS NOT NULL</code> ตรวจค่าว่างตามความหมายของ SQL</li>
                    </ul>
                </div>

                <h2 class="text-slate-800 mt-8 mb-4">ตัวอย่าง: รวมยอดคำสั่งซื้อที่ชำระแล้ว</h2>
                <p class="text-sm text-slate-700">สมมติว่าตาราง <code>customers</code> มี <code>customer_id</code> และ <code>full_name</code>; ตาราง <code>orders</code> มี <code>customer_id</code>, <code>amount</code> และ <code>status</code> ตรวจชื่อและความหมายของคอลัมน์กับ schema จริงของระบบก่อนใช้</p>
                <pre class="bg-slate-900 text-slate-100 p-5 rounded-xl overflow-x-auto text-sm"><code>SELECT c.customer_id,
       c.full_name,
       SUM(o.amount) AS total_paid
FROM customers AS c
JOIN orders AS o ON o.customer_id = c.customer_id
WHERE o.status = 'paid'
GROUP BY c.customer_id, c.full_name
HAVING SUM(o.amount) &gt; 1000
ORDER BY total_paid DESC
LIMIT 20;</code></pre>
                <p class="text-xs text-slate-500 mt-2">ตัวอย่างใช้รูปแบบ <code>LIMIT</code> ที่ฐานข้อมูลบางชนิดรองรับ ไวยากรณ์การจำกัดจำนวนแถวอาจต่างกันระหว่างระบบจัดการฐานข้อมูล</p>

                <h2 class="text-slate-800 mt-8 mb-4">ใช้ SQL ในการตรวจอะไร?</h2>
                <ul class="list-disc pl-5 space-y-2 text-sm text-slate-700">
                    <li>บันทึกถูกสร้างหรืออัปเดตตามกติกาและความสัมพันธ์ที่ตกลงกันหรือไม่</li>
                    <li>ยอดรวม สถานะ จำนวนแถว และข้อมูลซ้ำตรงกับผลจาก API หรือหน้าจอหรือไม่ โดยคำนึงถึง cache และการประมวลผลแบบหน่วงเวลา</li>
                    <li>ข้อมูลที่ไม่ครบ ค่าว่าง ขอบเขตตัวเลข เวลา และการปัดเศษถูกจัดการอย่างไร</li>
                    <li>การเรียงหรือกรองข้อมูลให้ผลตรงตามเงื่อนไข เมื่อมีแถวซ้ำหรือหลายความสัมพันธ์หรือไม่</li>
                </ul>

                <div class="bg-red-50 p-5 rounded-xl border border-red-200 mt-8">
                    <h2 class="text-red-800 mt-0 font-bold">ข้อควรระวังเมื่อเข้าถึงฐานข้อมูล</h2>
                    <ul class="list-disc pl-5 space-y-2 text-sm text-red-900 mb-0">
                        <li>ใช้บัญชี read-only และฐานข้อมูลทดสอบเมื่อเป็นไปได้ สอบถามขั้นตอนของทีมก่อนเชื่อมต่อ</li>
                        <li>เริ่มจากระบุคอลัมน์และตัวกรองให้แคบ จำกัดผลลัพธ์ และระวัง query ที่ใช้ทรัพยากรมาก</li>
                        <li>อย่ารัน <code>UPDATE</code>, <code>DELETE</code>, DDL หรือคำสั่งแก้ข้อมูลในระบบจริงโดยไม่มีการอนุมัติและแผนควบคุมที่ชัดเจน</li>
                        <li>ไม่คัดลอกข้อมูลส่วนบุคคลหรือข้อมูลลับไปไว้ใน ticket, portfolio, ภาพหน้าจอ หรือเครื่องมือภายนอกโดยไม่ได้รับอนุญาต</li>
                    </ul>
                </div>
            `,
            'perf_metrics': `
                <h1 class="text-slate-900 border-b-2 border-purple-500 pb-2 inline-block">Performance Metrics ที่ต้องรู้</h1>
                <p class="text-slate-600 mt-4 text-lg">Performance testing วัดพฤติกรรมระบบภายใต้ workload ที่กำหนด แล้วเปรียบเทียบกับเป้าหมาย เช่น latency, throughput และ error rate เพื่อประเมินความเหมาะสมและค้นหาคอขวดโดยดูหลักฐานจากทั้งแอปและตัวสร้างโหลด</p>

                <div class="space-y-6 mt-8">
                    <!-- Metric 1 -->
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-md relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-2 h-full bg-blue-500"></div>
                        <strong class="text-slate-800 text-xl block mb-2 flex items-center"><i class="fas fa-stopwatch text-blue-500 mr-3 text-2xl"></i> Response Time / Latency (ความเร็ว)</strong>
                        <p class="text-sm text-slate-600 mb-3">ระยะเวลาที่วัดจากจุดเริ่มจนถึงเหตุการณ์ที่กำหนด เช่น เริ่มส่ง request จนรับ response ครบ หรือจนผู้ใช้เห็นผลลัพธ์ ควรระบุจุดวัดและหน่วยให้ชัดก่อนเปรียบเทียบ</p>
                        <div class="bg-slate-50 p-3 rounded border border-slate-200">
                            <strong class="text-amber-600 text-sm"><i class="fas fa-lightbulb mr-1" aria-hidden="true"></i> ข้อควรดูร่วมกัน: อย่าดูแค่ค่าเฉลี่ย</strong>
                            <p class="text-xs text-slate-600 mt-1 mb-0">ค่าเฉลี่ยอาจซ่อน request ที่ช้ามากไว้ ค่า P95 หมายถึงประมาณ 95% ของตัวอย่างที่วัดได้ใช้เวลาไม่เกินค่านี้ ส่วนที่เหลือช้ากว่า ควรดูควบคู่กับค่ากลาง ช่วงเวลา จำนวนตัวอย่าง และรูปแบบการใช้งาน ไม่ใช่ค่าที่ดีที่สุดในทุกกรณี</p>
                        </div>
                    </div>

                    <!-- Metric 2 -->
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-md relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-2 h-full bg-green-500"></div>
                        <strong class="text-slate-800 text-xl block mb-2 flex items-center"><i class="fas fa-water text-green-500 mr-3 text-2xl"></i> Throughput / RPS (ปริมาณงาน)</strong>
                        <p class="text-sm text-slate-600 mb-3">ปริมาณงานที่ระบบทำได้ต่อเวลา เช่น requests per second (RPS) หรือธุรกรรมต่อวินาที (TPS) สองค่านี้ไม่จำเป็นต้องเท่ากัน เพราะหนึ่งธุรกรรมอาจเรียกหลาย request</p>
                        <div class="bg-slate-50 p-3 rounded border border-slate-200">
                            <strong class="text-red-600 text-sm"><i class="fas fa-chart-line mr-1"></i> การหาจุดคอขวด:</strong>
                            <p class="text-xs text-slate-600 mt-1 mb-0">เมื่อเพิ่มภาระงาน ให้สังเกต throughput, latency, errors และทรัพยากรพร้อมกัน การที่ throughput เริ่มคงที่ขณะที่เวลาและข้อผิดพลาดเพิ่มขึ้นอาจเป็นสัญญาณของคอขวด แต่ต้องแยกผลจากตัวสร้างโหลดและเครือข่ายด้วย</p>
                        </div>
                    </div>

                    <!-- Metric 3 -->
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-md relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-2 h-full bg-red-500"></div>
                        <strong class="text-slate-800 text-xl block mb-2 flex items-center"><i class="fas fa-times-circle text-red-500 mr-3 text-2xl"></i> Error Rate (อัตราการพัง)</strong>
                        <p class="text-sm text-slate-600 mb-3">สัดส่วนคำขอที่ไม่ผ่านเกณฑ์ที่ตกลงกัน เช่น ข้อผิดพลาดที่ไม่คาดหวัง หมดเวลา หรือผลธุรกิจไม่ถูกต้อง ต้องกำหนดว่า response แบบใดนับเป็นข้อผิดพลาด เพราะ 4xx บางกรณีอาจเป็นผลที่คาดหวัง</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-md relative overflow-hidden">
                        <div class="absolute right-0 top-0 w-2 h-full bg-purple-500"></div>
                        <strong class="text-slate-800 text-xl block mb-2 flex items-center"><i class="fas fa-microchip text-purple-500 mr-3 text-2xl" aria-hidden="true"></i> Resource & Saturation</strong>
                        <p class="text-sm text-slate-600 mb-0">ติดตาม CPU, memory, connection pool, queue และทรัพยากรของตัวสร้างโหลด เพื่อแยกว่าคอขวดอยู่ที่บริการที่ทดสอบหรือเครื่องมือสร้าง traffic</p>
                    </div>
                </div>
                <p class="text-sm text-slate-700 mt-6">ตั้งเป้าหมายจากความต้องการและ baseline ที่วัดได้ เช่น percentile latency, error rate และ throughput ภายใต้ workload ที่ระบุ อย่าตีความผลหนึ่งรอบว่าแทนประสบการณ์ของผู้ใช้ทุกคนได้</p>
            `,
            'k6_intro': `
                <h1 class="text-slate-900 border-b-2 border-purple-500 pb-2 inline-block">เขียน Load Test ด้วย k6</h1>
                <p class="text-slate-600 mt-4 text-lg"><strong>k6</strong> เป็นเครื่องมือทดสอบ performance ที่กำหนด workload ด้วยสคริปต์ JavaScript ให้เลือกเครื่องมือจากรูปแบบการทดสอบ ภาษา การรายงาน และระบบที่ทีมใช้อยู่ แทนการสรุปว่าเครื่องมือหนึ่งเร็วหรือเหมาะกว่าทุกกรณี</p>

                <div class="bg-purple-50 p-5 rounded-xl border border-purple-200 my-6 shadow-sm">
                    <h3 class="text-purple-800 mt-0 font-bold"><i class="fas fa-users mr-2 text-purple-600"></i> คอนเซปต์หลัก: Virtual Users (VUs)</h3>
                    <p class="text-sm text-purple-900 mb-0">Virtual Users (VUs) ใช้จำลองงานที่ทำซ้ำในรูปแบบหนึ่ง แต่จำนวน VUs ไม่เท่ากับจำนวนผู้ใช้จริงโดยตรง k6 ยังมี executor ที่กำหนดอัตราการเริ่ม iteration ได้ เลือกแบบจำลองตาม traffic ที่ต้องการศึกษา</p>
                </div>

                <h3 class="text-purple-800 mt-8 mb-4 border-b border-slate-200 pb-2"><i class="fas fa-code mr-2"></i> โครงสร้างสคริปต์ k6</h3>
                <div class="bg-slate-900 text-slate-300 p-5 rounded-xl font-mono text-sm overflow-x-auto shadow-lg my-4 relative group">
                    <div class="absolute top-0 right-0 bg-slate-700 text-xs px-3 py-1 rounded-bl-lg rounded-tr-xl text-slate-200 font-sans opacity-70 group-hover:opacity-100 transition">load-test.js</div>
<pre class="m-0 leading-relaxed"><code><span class="text-pink-400">import</span> http <span class="text-pink-400">from</span> <span class="text-green-300">'k6/http'</span>;
<span class="text-pink-400">import</span> { check, sleep } <span class="text-pink-400">from</span> <span class="text-green-300">'k6'</span>;

<span class="text-slate-500">// 1. Options (ตั้งค่าสถานการณ์การยิงโหลด)</span>
<span class="text-blue-400">export const</span> options = {
  vus: <span class="text-orange-400">1</span>,          <span class="text-slate-500">// ตัวอย่างขนาดเล็ก ปรับตามแผนที่ได้รับอนุมัติ</span>
  duration: <span class="text-green-300">'30s'</span>,  <span class="text-slate-500">// ตัวอย่างช่วงเวลาสั้น</span>
  thresholds: {
    <span class="text-slate-500">// ตั้งเป้าว่า 95% ของ Request ต้องตอบกลับไวกว่า 500ms</span>
    http_req_duration: [<span class="text-green-300">'p(95)&lt;500'</span>], 
    <span class="text-slate-500">// Error rate ต้องน้อยกว่า 1%</span>
    http_req_failed: [<span class="text-green-300">'rate&lt;0.01'</span>],
    <span class="text-slate-500">// check ที่ไม่ผ่านต้องต่ำกว่า 1% จึงทำให้ run ล้มเหลว</span>
    checks: [<span class="text-green-300">'rate&gt;0.99'</span>]
  },
};

<span class="text-slate-500">// 2. Default Function (พฤติกรรมของ 1 VU)</span>
<span class="text-blue-400">export default function</span> () {
  <span class="text-slate-500">// แทนที่ URL ด้วย endpoint ทดสอบที่ได้รับอนุญาตเท่านั้น</span>
  <span class="text-blue-400">const</span> res = http.<span class="text-yellow-200">get</span>(<span class="text-green-300">'https://api.example.test/products'</span>);
  
  <span class="text-slate-500">// ทำ Assertion เช็ค Status</span>
  <span class="text-yellow-200">check</span>(res, {
    <span class="text-green-300">'status was 200'</span>: (r) => r.status === <span class="text-orange-400">200</span>,
  });
  
  <span class="text-slate-500">// หน่วงเวลา 1 วินาที (จำลองพฤติกรรมมนุษย์ที่ต้องอ่านจอ)</span>
  <span class="text-yellow-200">sleep</span>(<span class="text-orange-400">1</span>);
}</code></pre>
                </div>
                <div class="bg-red-50 p-5 rounded-xl border border-red-200 mt-6">
                    <strong class="text-red-800">ก่อนสร้างโหลด:</strong>
                    <p class="text-sm text-red-900 mt-1 mb-0">รันทดสอบเฉพาะระบบและช่วงเวลาที่ทีมอนุมัติ ระบุปริมาณ ระยะเวลา และผู้ติดต่อ เริ่มจากโหลดต่ำ ตรวจผลกระทบ และหยุดเมื่อถึงเกณฑ์ที่ตกลงไว้ อย่ายิงโหลดใส่ระบบจริงหรือ endpoint สาธารณะโดยพลการ</p>
                </div>
                
                <div class="flex items-center text-slate-700 text-sm mt-4 bg-slate-100 p-3 rounded border border-slate-300">
                    <i class="fas fa-terminal text-slate-500 text-lg mr-3"></i>
                    <div>
                        <strong>วิธีรันสคริปต์ใน Terminal:</strong><br>
                        <code class="text-indigo-600 bg-white px-1 py-0.5 rounded border border-slate-200 mt-1 inline-block">k6 run load-test.js</code>
                    </div>
                </div>
            `,
            'git_qa': `
                <h1 class="text-slate-900 border-b-2 border-red-500 pb-2 inline-block">Git Workflow สำหรับฝั่ง QA</h1>
                <p class="text-slate-600 mt-4 text-lg">Git บันทึกประวัติการเปลี่ยนแปลงและช่วยให้ทีมพัฒนางานร่วมกัน ไม่จำเป็นต้องเริ่มจากการเขียนโค้ด automation จึงจะเรียนพื้นฐานนี้ได้</p>

                <h3 class="text-red-800 mt-8 mb-4 border-b border-slate-200 pb-2"><i class="fas fa-code-branch mr-2"></i> คำศัพท์ Git ฉบับรวบรัด</h3>
                
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm flex flex-col sm:flex-row items-start">
                        <div class="bg-slate-100 w-full sm:w-32 py-2 text-center rounded font-mono font-bold text-slate-800 mr-4 mb-2 sm:mb-0 border border-slate-300">Clone</div>
                        <div class="flex-1">
                            <strong class="text-slate-800 block text-md">การก๊อปปี้โปรเจกต์</strong>
                            <p class="text-sm text-slate-600 mt-1 mb-0">สร้างสำเนา repository จาก remote มาไว้ในเครื่อง การ clone ครั้งต่อไปทำเมื่อสร้าง working copy ใหม่</p>
                        </div>

            'github_actions': `

<span class="text-green-300">jobs:</span>

                <div class="space-y-4">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-md block mb-1">1. Test Case ID & Title (รหัสและชื่อเรื่อง)</strong>

                    </div>
                    
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                        <strong class="text-slate-800 text-md block mb-1">2. Pre-condition (เงื่อนไขก่อนเริ่มเทส)</strong>
                        <p class="text-sm text-slate-600 mb-0">เงื่อนไขก่อนเริ่ม เช่น บัญชีทดสอบอยู่ในสถานะที่กำหนดหรือบริการจำลองพร้อมใช้งาน ถ้าไม่ต้องเตรียมอะไรเป็นพิเศษให้ระบุว่าไม่มี</p>
                    </div>

                { label: 'OWASP Web Security Testing Guide', url: 'https://owasp.org/projects/web-security-testing-guide?tab=main' },
                { label: 'OWASP Application Security Verification Standard (ASVS)', url: 'https://owasp.org/projects/asvs?tab=main' }
            ],
            playwright: [
                { label: 'Playwright: Best Practices', url: 'https://playwright.dev/docs/best-practices' },
                { label: 'Playwright: Locators', url: 'https://playwright.dev/docs/locators' }
            ],
            cypress: [
                { label: 'Cypress: Retry-ability', url: 'https://docs.cypress.io/app/core-concepts/retry-ability' },
                { label: 'Cypress: Cross-origin testing', url: 'https://docs.cypress.io/app/guides/cross-origin-testing' },
                { label: 'Cypress: Test isolation', url: 'https://docs.cypress.io/app/core-concepts/test-isolation' }
            ],
            api_deepdive: [
                { label: 'IETF RFC 9110: HTTP Semantics', url: 'https://www.rfc-editor.org/rfc/rfc9110.html' }
            ],
            postman_advanced: [
                { label: 'Postman Docs: Write scripts to test API response data', url: 'https://learning.postman.com/docs/tests-and-scripts/write-scripts/test-scripts/' },
                { label: 'Postman Docs: Use vault secrets', url: 'https://learning.postman.com/docs/use/postman-vault/use-vault-secrets' },
                { label: 'Postman Docs: Install and run Newman', url: 'https://learning.postman.com/docs/reference/newman-cli/installing-running-newman/' }
            ],
            database_testing: [
                { label: 'PostgreSQL Documentation: Queries', url: 'https://www.postgresql.org/docs/current/queries.html' }
            ],
            k6_intro: [
                { label: 'Grafana k6: Scenarios and executors', url: 'https://grafana.com/docs/k6/latest/using-k6/scenarios/' },
                { label: 'Grafana k6: Test for performance', url: 'https://grafana.com/docs/k6/latest/examples/get-started-with-k6/test-for-performance/' }
            ],
            github_actions: [
                { label: 'GitHub Actions: Secure use reference', url: 'https://docs.github.com/en/actions/reference/security/secure-use' },
                { label: 'GitHub Actions: Secrets', url: 'https://docs.github.com/en/actions/concepts/security/secrets' }
            ],
            how_to_get_job: [
                { label: 'OWASP Web Security Testing Guide', url: 'https://owasp.org/www-project-web-security-testing-guide/' }
            ],
            how_to_write_testcase: [
                { label: 'ISTQB Certified Tester Foundation Level Syllabus v4.0.1', url: 'https://istqb.org/wp-content/uploads/2024/11/ISTQB_CTFL_Syllabus_v4.0.1.pdf' }
            ]
        };

        const articleSearchIndex = {};
        const PRACTICE_PROGRESS_KEY = 'tester-wiki-practice-progress-v1';
        let completedPracticeIds = new Set();
        let practiceProgressLoaded = false;
        let practiceStorageAvailable = true;

        function readPracticeProgress() {
            try {
                const savedIds = JSON.parse(window.localStorage.getItem(PRACTICE_PROGRESS_KEY) || '[]');
                const knownIds = new Set(practiceExercises.map(exercise => exercise.id));
                return new Set(Array.isArray(savedIds) ? savedIds.filter(id => knownIds.has(id)) : []);
            } catch (error) {
                practiceStorageAvailable = false;
                return new Set();
            }
        }

        function savePracticeProgress() {
            try {
                window.localStorage.setItem(PRACTICE_PROGRESS_KEY, JSON.stringify([...completedPracticeIds]));
                practiceStorageAvailable = true;
            } catch (error) {
                practiceStorageAvailable = false;
            }
        }

        function updatePracticeProgress() {
            const progressText = document.getElementById('practiceProgressText');
            const progressBar = document.getElementById('practiceProgressBar');
            const resetButton = document.getElementById('practiceResetButton');
            if (!progressText || !progressBar || !resetButton) return;

            const completedCount = completedPracticeIds.size;
            progressBar.max = practiceExercises.length;
            progressBar.value = completedCount;
            progressBar.setAttribute('aria-valuetext', `${completedCount} จาก ${practiceExercises.length} ข้อ`);
            progressText.textContent = `ตอบถูกแล้ว ${completedCount} / ${practiceExercises.length} ข้อ`;
            const storageNote = document.getElementById('practiceStorageNote');
            if (storageNote) {
                storageNote.textContent = practiceStorageAvailable
                    ? 'บันทึกความคืบหน้าไว้เฉพาะในเบราว์เซอร์นี้'
                    : 'เบราว์เซอร์ไม่อนุญาตให้บันทึก จะจำความคืบหน้าไว้ระหว่างเซสชันนี้เท่านั้น';
            }
            resetButton.disabled = completedCount === 0;
            resetButton.classList.toggle('opacity-50', resetButton.disabled);
            resetButton.classList.toggle('cursor-not-allowed', resetButton.disabled);
        }

        function renderPracticeExercises(skill = 'all') {
            const list = document.getElementById('practiceExerciseList');
            const summary = document.getElementById('practiceResultsSummary');
            if (!list || !summary) return;

            const exercises = practiceExercises.filter(exercise => skill === 'all' || exercise.skill === skill);
            list.replaceChildren();
            summary.textContent = `แสดง ${exercises.length} จาก ${practiceExercises.length} โจทย์`;

            if (exercises.length === 0) {
                const emptyState = document.createElement('p');
                emptyState.className = 'rounded-xl border border-slate-200 bg-white p-5 text-sm text-slate-600';
                emptyState.textContent = 'ยังไม่มีโจทย์ในทักษะนี้';
                list.appendChild(emptyState);
                return;
            }

            const fragment = document.createDocumentFragment();
            exercises.forEach((exercise, exerciseIndex) => {
                const card = document.createElement('article');
                card.className = 'rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6';

                const badges = document.createElement('div');
                badges.className = 'flex flex-wrap items-center gap-2';
                const skillBadge = document.createElement('span');
                skillBadge.className = 'rounded-full bg-indigo-50 px-3 py-1 text-xs font-semibold text-indigo-800';
                skillBadge.textContent = exercise.skill;
                const levelBadge = document.createElement('span');
                levelBadge.className = 'rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-600';
                levelBadge.textContent = `ระดับ ${exercise.level}`;
                badges.append(skillBadge, levelBadge);

                const heading = document.createElement('h3');
                heading.className = 'mb-2 mt-4 text-lg font-bold text-slate-900';
                heading.textContent = `${exerciseIndex + 1}. ${exercise.title}`;

                const scenario = document.createElement('p');
                scenario.className = 'mb-4 text-sm leading-6 text-slate-700';
                scenario.textContent = exercise.scenario;

                const form = document.createElement('form');
                form.dataset.practiceId = exercise.id;
                form.noValidate = true;

                const fieldset = document.createElement('fieldset');
                fieldset.className = 'space-y-2';
                const legend = document.createElement('legend');
                legend.className = 'mb-3 text-sm font-semibold leading-6 text-slate-800';
                legend.textContent = exercise.prompt;
                fieldset.appendChild(legend);

                const choices = document.createElement('div');
                choices.className = 'space-y-2';
                exercise.options.forEach((option, optionIndex) => {
                    const label = document.createElement('label');
                    label.className = 'flex cursor-pointer items-start gap-3 rounded-xl border border-slate-200 p-3 text-sm leading-6 text-slate-700 hover:border-indigo-300 hover:bg-indigo-50 focus-within:ring-2 focus-within:ring-indigo-500';
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `practice-answer-${exercise.id}`;
                    input.value = String(optionIndex);
                    input.className = 'mt-1 h-4 w-4 shrink-0 accent-indigo-600';
                    input.setAttribute('aria-describedby', `practice-feedback-${exercise.id}`);
                    const text = document.createElement('span');
                    text.textContent = option.text;
                    label.append(input, text);
                    choices.appendChild(label);
                });
                fieldset.appendChild(choices);

                const submit = document.createElement('button');
                submit.type = 'submit';
                submit.className = 'mt-4 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2';
                submit.textContent = 'ตรวจคำตอบ';

                const feedback = document.createElement('p');
                feedback.id = `practice-feedback-${exercise.id}`;
                feedback.className = 'practice-feedback';
                feedback.setAttribute('role', 'status');
                feedback.setAttribute('aria-live', 'polite');
                feedback.hidden = true;

                form.append(fieldset, submit, feedback);
                card.append(badges, heading, scenario, form);
                fragment.appendChild(card);
            });
            list.appendChild(fragment);
        }

        function initPracticeLab() {
            const filter = document.getElementById('practiceSkillFilter');
            if (!filter) return;

            if (!practiceProgressLoaded) {
                completedPracticeIds = readPracticeProgress();
                practiceProgressLoaded = true;
            }
            if (!filter.dataset.ready) {
                const skills = [...new Set(practiceExercises.map(exercise => exercise.skill))];
                skills.forEach(skill => {
                    const option = document.createElement('option');
                    option.value = skill;
                    option.textContent = skill;
                    filter.appendChild(option);
                });
                filter.dataset.ready = 'true';
                filter.addEventListener('change', () => renderPracticeExercises(filter.value));
            }
            document.getElementById('practiceProgressBar').max = practiceExercises.length;
            updatePracticeProgress();
            renderPracticeExercises(filter.value || 'all');
        }

        function buildArticleSearchIndex() {
            Object.keys(articleData).forEach(id => {
                const template = document.createElement('template');
                template.innerHTML = articleData[id];
                articleSearchIndex[id] = (template.content.textContent || '').toLocaleLowerCase('th-TH');
            });
            articleSearchIndex.tester_practice += ' ' + practiceExercises.map(exercise => [exercise.skill, exercise.title, exercise.scenario, exercise.prompt, ...exercise.options.map(option => option.text)].join(' ')).join(' ').toLocaleLowerCase('th-TH');
        }

        function renderSidebar(filterText = '') {
            const nav = document.getElementById('sidebarNav');
            const query = filterText.trim().toLocaleLowerCase('th-TH');
            nav.replaceChildren();
            let resultCount = 0;

            menuData.forEach((section, index) => {
                const matchingItems = section.items.filter(item => {
                    return !query || item.title.toLocaleLowerCase('th-TH').includes(query) ||
                        (articleSearchIndex[item.id] || '').includes(query);
                });
                if (matchingItems.length === 0) return;

                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'px-5 py-2' + (index > 0 ? ' mt-4' : '');
                const heading = document.createElement('h2');
                heading.className = 'text-xs font-bold text-slate-500 uppercase tracking-wider font-heading mb-3';
                const icon = document.createElement('i');
                icon.className = section.icon + ' mr-2';
                icon.setAttribute('aria-hidden', 'true');
                heading.append(icon, document.createTextNode(section.category));
                sectionDiv.appendChild(heading);

                const list = document.createElement('ul');
                list.className = 'space-y-1';
                matchingItems.forEach(item => {
                    resultCount += 1;
                    const row = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = '#' + item.id;
                    link.dataset.articleId = item.id;
                    link.className = 'nav-item flex items-center px-4 py-2 text-sm text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 rounded-lg transition-colors border-r-[3px] border-transparent focus-visible:outline focus-visible:outline-2 focus-visible:outline-indigo-600';
                    link.id = 'nav-' + item.id;
                    link.textContent = item.title;
                    if (item.id === window.currentArticleId) {
                        link.classList.add('active');
                        link.setAttribute('aria-current', 'page');
                    }
                    row.appendChild(link);
                    list.appendChild(row);
                });
                sectionDiv.appendChild(list);
                nav.appendChild(sectionDiv);
            });

            if (query && resultCount === 0) {
                const emptyState = document.createElement('p');
                emptyState.className = 'px-5 py-6 text-sm text-slate-500';
                emptyState.setAttribute('role', 'status');
                emptyState.textContent = 'ไม่พบบทความที่ตรงกับคำค้น';
                nav.appendChild(emptyState);
            }
        }

        function appendArticleSources(contentArea, id) {
            const sources = articleSources[id] || [];
            if (sources.length === 0) return;

            const section = document.createElement('section');
            section.className = 'not-prose mt-12 border-t border-slate-200 pt-6';
            const heading = document.createElement('h2');
            heading.className = 'text-lg font-bold text-slate-800';
            heading.textContent = 'แหล่งอ้างอิงและอ่านต่อ';
            const list = document.createElement('ul');
            list.className = 'mt-3 list-disc space-y-2 pl-5 text-sm';
            sources.forEach(source => {
                const item = document.createElement('li');
                const link = document.createElement('a');
                link.href = source.url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = source.label;
                item.appendChild(link);
                list.appendChild(item);
            });
            section.append(heading, list);
            contentArea.appendChild(section);
        }

        function getArticleMeta(id) {
            for (const section of menuData) {
                const item = section.items.find(candidate => candidate.id === id);
                if (item) return { item, category: section.category.replace(/^\d+\.\s*/, '') };
            }
            return null;
        }

        function loadArticle(id, updateHistory = false) {
            const meta = getArticleMeta(id);
            if (!meta || !articleData[id]) return false;

            if (updateHistory && window.location.hash !== '#' + id) {
                window.history.pushState({ articleId: id }, '', '#' + id);
            }
            window.currentArticleId = id;
            document.getElementById('bc-category').textContent = meta.category;
            document.getElementById('bc-title').textContent = meta.item.title;
            document.title = meta.item.title + ' | Tester Wiki';

            document.querySelectorAll('.nav-item').forEach(link => {
                link.classList.remove('active');
                link.removeAttribute('aria-current');
                if (link.dataset.articleId === id) {
                    link.classList.add('active');
                    link.setAttribute('aria-current', 'page');
                }
            });

            const contentArea = document.getElementById('articleContent');
            contentArea.innerHTML = articleData[id];
            appendArticleSources(contentArea, id);
            if (id === 'tester_practice') initPracticeLab();
            document.getElementById('mainContentArea').scrollTop = 0;
            const heading = contentArea.querySelector('h1');
            if (heading) {
                heading.tabIndex = -1;
                heading.focus({ preventScroll: true });
            }

            if (window.innerWidth < 768 && mobileMenuOpen) toggleMobileMenu();
            return true;
        }

        function filterMenu() {
            renderSidebar(document.getElementById('searchInput').value);
        }

        let mobileMenuOpen = false;
        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            const button = document.getElementById('mobileMenuButton');
            mobileMenuOpen = !mobileMenuOpen;
            sidebar.classList.toggle('-translate-x-full', !mobileMenuOpen);
            sidebar.classList.toggle('translate-x-0', mobileMenuOpen);
            overlay.classList.toggle('hidden', !mobileMenuOpen);
            button.setAttribute('aria-expanded', String(mobileMenuOpen));
            button.setAttribute('aria-label', mobileMenuOpen ? 'ปิดเมนูหลัก' : 'เปิดเมนูหลัก');
        }

        document.getElementById('sidebarNav').addEventListener('click', event => {
            const link = event.target.closest('a[data-article-id]');
            if (!link) return;
            event.preventDefault();
            loadArticle(link.dataset.articleId, true);
        });

        document.addEventListener('submit', event => {
            const form = event.target.closest('form[data-practice-id]');
            if (!form) return;
            event.preventDefault();

            const exercise = practiceExercises.find(item => item.id === form.dataset.practiceId);
            const feedback = form.querySelector('.practice-feedback');
            const selected = form.querySelector('input[type="radio"]:checked');
            if (!exercise || !feedback) return;

            feedback.hidden = false;
            if (!selected) {
                feedback.dataset.state = 'neutral';
                feedback.textContent = 'เลือกคำตอบก่อน แล้วกดตรวจคำตอบอีกครั้ง';
                return;
            }

            const option = exercise.options[Number(selected.value)];
            if (!option) return;
            feedback.dataset.state = option.correct ? 'correct' : 'try-again';
            feedback.textContent = `${option.correct ? 'ถูกต้อง' : 'ลองอีกครั้ง'} — ${option.feedback}`;

            if (option.correct && !completedPracticeIds.has(exercise.id)) {
                completedPracticeIds.add(exercise.id);
                savePracticeProgress();
                updatePracticeProgress();
            }
        });

        document.addEventListener('click', event => {
            const resetButton = event.target.closest('#practiceResetButton');
            if (!resetButton || !completedPracticeIds.size) return;
            if (!window.confirm('ล้างความคืบหน้าการฝึกที่บันทึกไว้ในเบราว์เซอร์นี้หรือไม่?')) return;

            completedPracticeIds = new Set();
            savePracticeProgress();
            updatePracticeProgress();
            const filter = document.getElementById('practiceSkillFilter');
            renderPracticeExercises(filter ? filter.value : 'all');
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && mobileMenuOpen) {
                toggleMobileMenu();
                document.getElementById('mobileMenuButton').focus();
            }
        });

        window.addEventListener('popstate', () => {
            const id = window.location.hash.slice(1);
            loadArticle(id || 'intro');
        });

        document.addEventListener('DOMContentLoaded', () => {
            buildArticleSearchIndex();
            renderSidebar();
            const requestedId = window.location.hash.slice(1);
            if (!loadArticle(requestedId || 'intro')) loadArticle('intro');
        });    </script>
</body>
</html>
